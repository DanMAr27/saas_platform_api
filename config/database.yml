default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "saas_platform_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "saas_platform_test") %>

production:
 

  # <<: *default (Mantén esta línea si *default contiene otras configuraciones útiles)
  <<: *default 
  # database: <%= ENV.fetch("DATABASE_NAME") %>
  # username: <%= ENV.fetch("DATABASE_USERNAME") %>
  # password: <%= ENV.fetch("DATABASE_PASSWORD") %>
  
  # Esta es la línea crucial: le dice a Rails que use la URL completa
  # que Render inyecta en la variable DATABASE_URL.
  url: <%= ENV.fetch("DATABASE_URL") %>

  # Opcional, solo si necesitas configurar el pool de conexiones:
  # pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>